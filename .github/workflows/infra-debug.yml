# Временный разбор шага 20: брокер и ClickHouse отдельно от полной сборки. Данные синтетические.
name: infra-debug
on:
  push:
    branches: [step20-infra]
jobs:
  clickhouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432:5432']
        options: --shm-size=1g --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      REPRACER_PG_URL: postgres://svc_app@127.0.0.1:5432/repracer_eu
      REPRACER_PG_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
      REPRACER_PG_TEMPLATE: repracer_template
      REPRACER_CH_URL: http://127.0.0.1:18123
      REPRACER_CH_USER: repracer_local_admin
      REPRACER_CH_PASSWORD: ci-synthetic-only
      REPRACER_CH_INGEST_USER: repracer_ci_ingest
      REPRACER_CH_INGEST_PASSWORD: ci-synthetic-ingest
      REPRACER_CH_VERIFIER_USER: repracer_ci_verifier
      REPRACER_CH_VERIFIER_PASSWORD: ci-synthetic-verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - name: ClickHouse
        run: |
          docker run -d --name clickhouse -p 18123:8123 --ulimit nofile=262144:262144 \
            -e CLICKHOUSE_USER=repracer_local_admin -e CLICKHOUSE_PASSWORD=ci-synthetic-only -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:26.8.4.11
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18123/ping && break; sleep 2; done
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npm ci
      - run: scripts/db/prepare.sh repracer_eu
      - name: Apply DDL
        run: node infra/local/apply-clickhouse.mjs
      - name: ClickHouse logins of the roles (ops, synthetic)
        run: |
          q() { curl -sS --fail-with-body -H "X-ClickHouse-User: $REPRACER_CH_USER" -H "X-ClickHouse-Key: $REPRACER_CH_PASSWORD" --data-binary "$1" "$REPRACER_CH_URL/"; }
          q "CREATE USER IF NOT EXISTS $REPRACER_CH_INGEST_USER IDENTIFIED WITH sha256_password BY '$REPRACER_CH_INGEST_PASSWORD' DEFAULT ROLE repracer_ingest"
          q "GRANT repracer_ingest TO $REPRACER_CH_INGEST_USER"
          q "CREATE USER IF NOT EXISTS $REPRACER_CH_VERIFIER_USER IDENTIFIED WITH sha256_password BY '$REPRACER_CH_VERIFIER_PASSWORD' DEFAULT ROLE repracer_retention"
          q "GRANT repracer_retention TO $REPRACER_CH_VERIFIER_USER"
      - name: Export from PostgreSQL
        working-directory: packages/pricing-store-pg
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning --test --test-reporter=spec test/clickhouse-export.pg.test.ts
      - name: Compression measurement
        env:
          REPRACER_PG_ADMIN_URL: postgres://postgres@127.0.0.1:5432/repracer_eu
        run: npm run bench -w @repracer/analytics-export -- --rows=1000000 --pg-rows=200000 --out=$GITHUB_WORKSPACE/compression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: compression, path: compression.json, if-no-files-found: ignore }
