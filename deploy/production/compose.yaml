# Р-158 (шаг 36), расширение Р-129: production-профиль на ОДИН VPS — часть репозитория, а не устная инструкция.
#   docker compose -f deploy/production/compose.yaml --env-file deploy/production/production.env up -d
#
# Что здесь есть и чего нет:
#   ЕСТЬ: TLS обратным прокси (Caddy, сертификат от Let's Encrypt автоматически), консоль продавца за ним,
#         панель оператора платформы [Р-165] — на своём порту и ТОЛЬКО на loopback: наружу она не выставляется,
#         суточная резервная копия PostgreSQL со сроком хранения ≤ 7 суток (требование docs/data-retention.md, OQ-61)
#         и проверенное восстановление (packages/pricing-store-pg/test/backup-restore.pg.test.ts — часть сборки, а не абзац в README).
#   НЕТ: самой PostgreSQL и ClickHouse — они разворачиваются отдельно (управляемая база или свой сервер): их бэкап,
#        обновления и доступы — свойство хостинга, и делать вид, что compose это решает, значит врать себе.
#   Процессы (планировщик, диспетчер, приёмник) поднимаются своими профилями deploy/scheduler, deploy/worker,
#   deploy/notification-receiver — они одинаковы в любом окружении, и дублировать их здесь нечем.
name: repracer-production

services:
  # TLS терминируется ЗДЕСЬ: у приложения нет ни сертификатов, ни 80-го порта — ему достаточно loopback [Р-158]
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      REPRACER_DOMAIN: ${REPRACER_DOMAIN:?set REPRACER_DOMAIN}
      REPRACER_ACME_EMAIL: ${REPRACER_ACME_EMAIL:?set REPRACER_ACME_EMAIL}
      # Шаг 46 [Р-184]: куда ведут «Live demo» и «контакт» лендинга. Не задано — на скрытый блок «скоро» своей языковой
      # страницы (до развёртывания, шаг 38, ч. 2). Умолчание — здесь, а не в Caddyfile: пустое значение Caddy подставил бы
      # как есть, и перенаправление вело бы в никуда
      # Публикация лендинга — только явным `on` (Impressum и защита данных, § 5 DDG — deploy/production/README.md, 3б)
      REPRACER_LANDING_PUBLIC: "${REPRACER_LANDING_PUBLIC:-off}"
      REPRACER_LANDING_DEMO_EN: "${REPRACER_LANDING_DEMO_URL:-/#demo-soon}"
      REPRACER_LANDING_DEMO_DE: "${REPRACER_LANDING_DEMO_URL:-/de/#demo-soon}"
      REPRACER_LANDING_CONTACT_EN: "${REPRACER_LANDING_CONTACT_URL:-/#contact-soon}"
      REPRACER_LANDING_CONTACT_DE: "${REPRACER_LANDING_CONTACT_URL:-/de/#contact-soon}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./snippets.caddy:/etc/caddy/snippets.caddy:ro
      # Шаг 46 [Р-184]: лендинг — статические страницы репозитория, отдаёт их этот же прокси
      - ../../apps/landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - console
    logging: { driver: json-file, options: { max-size: 50m, max-file: "5" } }

  # Шаг 37 [Р-159, OQ-221 закрыт]: консоль — процесс. Описан он ОДИН раз, в своём развёртывании, и берётся оттуда:
  # две копии одного сервиса расходятся в первый же шаг. Наружу его выставляет только прокси
  console:
    extends:
      file: ../console/compose.yaml
      service: console
    # Шаг 44 [Р-180]: промышленный профиль поднимается ТОЛЬКО с настоящим поставщиком identity. Без значений compose
    # отказывает ещё до контейнера, а процесс — при старте своей причиной; имитатора входа здесь нет и быть не может
    environment:
      REPRACER_PROFILE: production
      REPRACER_CONSOLE_OIDC_ISSUER: ${REPRACER_CONSOLE_OIDC_ISSUER:?set REPRACER_CONSOLE_OIDC_ISSUER (Р-180)}
      REPRACER_CONSOLE_OIDC_AUDIENCE: ${REPRACER_CONSOLE_OIDC_AUDIENCE:?set REPRACER_CONSOLE_OIDC_AUDIENCE (Р-180)}
      REPRACER_CONSOLE_OIDC_JWKS_URL: ${REPRACER_CONSOLE_OIDC_JWKS_URL:?set REPRACER_CONSOLE_OIDC_JWKS_URL (Р-180)}
      REPRACER_CONSOLE_OIDC_CLIENT_ID: ${REPRACER_CONSOLE_OIDC_CLIENT_ID:?set REPRACER_CONSOLE_OIDC_CLIENT_ID (Р-180)}
    # Порты своего развёртывания консоль оставляет как есть: они локальные (127.0.0.1) и нужны для осмотра на сервере.
    # Наружу её выставляет ТОЛЬКО прокси: 4319 на внешнем адресе не слушает никто

  # Шаг 44 (находка 8 ревью): массовые задания тенантов продавцов — ОТДЕЛЬНЫЙ процесс [Р-139]: тяжёлая работа заданий
  # не занимает цикл событий консоли. Тенантов с ждущими заданиями называет база; роли — те же файлы секретов, что у консоли
  bulk-worker:
    image: node:22.22.3-bookworm-slim
    working_dir: /app
    command: ["node", "--experimental-strip-types", "--disable-warning=ExperimentalWarning", "apps/console/server/bulk-worker.ts"]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      REPRACER_BULK_METRICS_PORT: "9473"
      # Р-127: отметка во внешнем сервисе; аккаунта сервиса нет (OQ-188) — выключение только явное, как у консоли
      REPRACER_BULK_HEARTBEAT: ${REPRACER_BULK_HEARTBEAT:-off}
      REPRACER_BULK_HEARTBEAT_URL_FILE: /run/secrets/bulk_heartbeat_url
      REPRACER_BULK_APP_PG_URL_FILE: /run/secrets/console_app_pg_url
      REPRACER_BULK_ADMIN_PG_URL_FILE: /run/secrets/console_admin_pg_url
      REPRACER_BULK_BULK_WORKER_PG_URL_FILE: /run/secrets/console_bulk_worker_pg_url
      REPRACER_BULK_STOCK_PG_URL_FILE: /run/secrets/console_stock_pg_url
    volumes:
      - ../..:/app:ro
      - ${REPRACER_SECRETS_DIR:?set REPRACER_SECRETS_DIR}:/run/secrets:ro
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9473/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:9473:9473"
    logging: { driver: json-file, options: { max-size: 50m, max-file: "5" } }

  # Шаг 40 [Р-165]: панель оператора платформы. Она НЕ за прокси и НЕ в Caddyfile намеренно: наружу её не выставляет
  # ничто, до неё добираются SSH-туннелем на 127.0.0.1:4327 или из названного списка адресов на самом сервере.
  # Порт свой, роль подключения своя, и в `depends_on` прокси её нет — прокси о ней не знает вовсе
  operator:
    extends:
      file: ../operator/compose.yaml
      service: operator
    environment:
      # Р-183 (шаг 45): режим стенда, ключ стенда и локальный издатель — отказ процесса при старте
      REPRACER_PROFILE: production

  # Суточная копия базы: pg_dump в том, старше REPRACER_BACKUP_KEEP_DAYS — удаляется (срок копий ≤ 7 суток, OQ-61)
  #
  # ПРОВАЛ КОПИИ И ВНЕШНИЙ КОНТРОЛЬ [Р-127, находка 8 ревью шага 36]. Доставка алертов [Р-156] читает `tenant_data.alert`
  # и требует базы и нашего кода — у контейнера копии нет ни того, ни другого, и придумывать ему доступ к базе ради
  # письма значит расширять поверхность компрометации ради одного события. Поэтому провал виден двумя способами, и оба
  # обязан подхватить ВНЕШНИЙ контроль, тот же, что следит за отметками процессов:
  #   1) строка stderr `{"event":"ALERT","code":"BACKUP_FAILED","severity":"CRITICAL",…}` — правило на логах;
  #   2) файл `BACKUP_FAILED` в каталоге копий (${REPRACER_BACKUP_DIR}) — живёт, пока копия не удаётся, и исчезает с
  #      первой удавшейся; проверяется тем же наблюдателем, что смотрит возраст последнего файла копии.
  # Пока такое правило у внешнего сервиса не заведено, провал копии остаётся замеченным только человеком в журнале —
  # это ограничение названо здесь, а не выдано за работающий механизм (OQ-188: аккаунта внешнего сервиса ещё нет).
  backup:
    image: postgres:16.10-bookworm
    user: "1000:1000"
    environment:
      REPRACER_BACKUP_KEEP_DAYS: ${REPRACER_BACKUP_KEEP_DAYS:-7}
      REPRACER_BACKUP_EVERY_SECONDS: ${REPRACER_BACKUP_EVERY_SECONDS:-86400}
      REPRACER_BACKUP_RETRY_SECONDS: ${REPRACER_BACKUP_RETRY_SECONDS:-900}
      PGURL_FILE: /run/secrets/backup_pg_url
    entrypoint: ["/bin/bash", "/opt/repracer/backup-loop.sh"]
    volumes:
      - ./backup-loop.sh:/opt/repracer/backup-loop.sh:ro
      - ${REPRACER_SECRETS_DIR:?set REPRACER_SECRETS_DIR}:/run/secrets:ro
      - ${REPRACER_BACKUP_DIR:?set REPRACER_BACKUP_DIR}:/backups
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 50m, max-file: "5" } }

volumes:
  caddy_data:
  caddy_config:
