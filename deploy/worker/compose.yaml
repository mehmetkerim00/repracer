# OQ-190 (шаг 27): развёртывание процесса пути решения за брокером — диспетчера записей [Р-64] и ретранслятора outbox [Р-34].
#   docker compose -f deploy/worker/compose.yaml --env-file deploy/worker/worker.env up -d
# Экземпляров может быть несколько (в отличие от планировщика): порядок внутри единицы записи держат ключ партиции, одна запись в полёте
# в базе и последовательные вызовы диспетчера; ретранслятор активен у того экземпляра, который взял advisory lock.
# Без этого процесса ждущая запись уходит в канал только обходом-страховкой — позже и мимо порядка брокера (живой прогон, шаг 27).
name: repracer-worker

services:
  worker:
    image: node:22.22.3-bookworm-slim
    # Тег образа закреплён; закрепление по digest (image: node@sha256:…) — при первом развёртывании в среде с доступом к реестру (проверить)
    working_dir: /app
    command: ["node", "--experimental-strip-types", "--disable-warning=ExperimentalWarning", "services/pricing-worker/src/main.ts"]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      REPRACER_WORKER_ID: ${REPRACER_WORKER_ID:-worker-1}
      REPRACER_WORKER_METRICS_PORT: "9465"
      REPRACER_WORKER_SWEEP_MS: ${REPRACER_WORKER_SWEEP_MS:-60000}
      REPRACER_WORKER_PARTITIONS: ${REPRACER_WORKER_PARTITIONS:-4}
      REPRACER_KAFKA_BROKERS: ${REPRACER_KAFKA_BROKERS:?set REPRACER_KAFKA_BROKERS}
      REPRACER_CHANNEL_SECRETS_DIR: /run/secrets/channels
      REPRACER_KAUFLAND_FALLBACK_EMAIL: ${REPRACER_KAUFLAND_FALLBACK_EMAIL:?set REPRACER_KAUFLAND_FALLBACK_EMAIL}
      REPRACER_KAUFLAND_BUY_BOX_CHANGED_ACCESS: ${REPRACER_KAUFLAND_BUY_BOX_CHANGED_ACCESS:-NOT_GRANTED}
      REPRACER_KAUFLAND_PARTNER_CREDENTIALS_REF: ${REPRACER_KAUFLAND_PARTNER_CREDENTIALS_REF:-}
      REPRACER_AMAZON_APPLICATION_CREDENTIALS_REF: ${REPRACER_AMAZON_APPLICATION_CREDENTIALS_REF:?set REPRACER_AMAZON_APPLICATION_CREDENTIALS_REF}
      # Секреты — файлами: в переменных окружения их видят все процессы контейнера и docker inspect
      REPRACER_APP_PG_URL_FILE: /run/secrets/app_pg_url
      REPRACER_DISPATCHER_PG_URL_FILE: /run/secrets/dispatcher_pg_url
      # Ретранслятор запускается во всех экземплярах, работает тот, кто взял advisory lock [Р-34]; убрать файл — экземпляр без ретранслятора
      REPRACER_RELAY_PG_URL_FILE: /run/secrets/relay_pg_url
    volumes:
      - ../..:/app:ro
      - ${REPRACER_SECRETS_DIR:?set REPRACER_SECRETS_DIR}:/run/secrets:ro
    # Один экземпляр на этот файл: порт метрик публикуется фиксированно, и второй контейнер его не займёт. Нужно больше экземпляров —
    # разворачивать копию файла с другим портом или оркестратором, который раздаёт порты сам (ревью шага 27, находка 4)
    deploy:
      replicas: 1
    restart: unless-stopped
    # Записи в полёте: даём диспетчеру дожить круг и закрыть потребителей, чтобы смещения не перескочили
    stop_grace_period: 60s
    healthcheck:
      # Ни обхода-страховки, ни обработанного сообщения дольше трёх обходов — контейнер нездоров
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9465/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "127.0.0.1:9465:9465"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
