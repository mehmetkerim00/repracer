# Локальный стенд инфраструктуры шага 10: брокер и аналитический слой. Только синтетические данные, только 127.0.0.1.
# Версии закреплены; обновление — вместе с прогоном проверок (schemas/clickhouse/099_verify.sql, тест порядка за брокером).
#   REPRACER_CH_PASSWORD=<любой локальный пароль> docker compose -f infra/local/compose.yaml up -d
name: repracer-local

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.4.11
    environment:
      CLICKHOUSE_USER: repracer_local_admin
      CLICKHOUSE_PASSWORD: ${REPRACER_CH_PASSWORD:?set REPRACER_CH_PASSWORD}
      # Администратор создаёт роли, профили и политики строк (001, 020)
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  clickhouse-data:
